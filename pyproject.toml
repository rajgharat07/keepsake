[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepsake"
version = "0.1.0"
description = "Offline AI memory companion for one grandparent — Gemma local + Tiger Data hybrid memory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "psycopg[binary]==3.2.9",
  "pgvector==0.4.1",
  "python-dotenv==1.1.1",
  "typer==0.16.0",
  "rich==14.1.0",
  "httpx==0.28.1",
  "sentry-sdk==2.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
]

[project.scripts]
keepsake = "keepsake.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
